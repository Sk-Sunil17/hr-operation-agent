# Mock systems for now. Real connectors implement the same interface, so swapping
# one in is a change to this file plus an implementation, never to the kernel.

adapters:
  - name: people_system
    kind: hris
    implementation: mock_hris
    owns_fields:
      - preferred_name
      - personal_email
      - phone
      - home_address
      - emergency_contact
      - bank_details
    operations: [read_person, read_manager, read_record, prepare_record_change, commit_record_change]
    settings: { seed: acme }

  - name: calendars
    kind: calendar
    implementation: mock_calendar
    operations: [free_busy, prepare_invite, commit_invite, prepare_cancel, commit_cancel]
    settings: { buffer_minutes: 15 }

  - name: documents
    kind: docstore
    implementation: mock_docstore
    operations: [read_document, prepare_file, commit_file]

  - name: slack
    kind: notify
    implementation: mock_notify
    operations: [prepare_message, commit_message]
    settings: { default_channel: "#people-help" }

  # Slack cannot reach a job candidate: they have no account here. An interview
  # that cannot be emailed cannot be communicated at all, so a company that
  # wants the agent to tell candidates anything configures a mail system too.
  - name: email
    kind: notify
    implementation: mock_mail
    operations: [prepare_message, commit_message]
    settings:
      from_address: "people@acme.test"
      reply_to: "people@acme.test"
