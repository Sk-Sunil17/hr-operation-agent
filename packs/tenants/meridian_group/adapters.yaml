adapters:
  - name: core_hr
    kind: hris
    implementation: mock_hris
    owns_fields:
      - preferred_name
      - personal_email
      - phone
      - home_address
      - emergency_contact
    operations: [read_person, read_manager, read_record, prepare_record_change, commit_record_change]
    settings: { seed: meridian, entities: [meridian_sg, meridian_my, meridian_hk] }

  - name: payroll_bank
    kind: hris
    implementation: mock_hris
    owns_fields:
      - bank_details          # a separate system owns banking here, with its own approvals
    operations: [read_person, read_record, prepare_record_change, commit_record_change]
    settings: { seed: meridian_bank }

  - name: service_desk
    kind: itsm
    implementation: mock_itsm
    operations: [prepare_request, commit_request]
    settings: { queue: HR-OPS }

  - name: group_calendars
    kind: calendar
    implementation: mock_calendar
    operations: [free_busy, prepare_invite, commit_invite, prepare_cancel, commit_cancel]
    settings: { buffer_minutes: 30 }

  - name: records
    kind: docstore
    implementation: mock_docstore
    operations: [read_document, prepare_file, commit_file]

  - name: signing
    kind: esign
    implementation: mock_esign
    operations: [prepare_envelope, commit_envelope]

  - name: teams_and_email
    kind: notify
    implementation: mock_notify
    operations: [prepare_message, commit_message]
    settings: { default_channel: "HR Operations" }

  # Candidates are emailed from the group recruitment address, not from an
  # individual recruiter, because the thread outlives whoever opened it.
  - name: candidate_mail
    kind: notify
    implementation: mock_mail
    operations: [prepare_message, commit_message]
    settings:
      from_address: "recruitment@meridian.test"
      reply_to: "recruitment@meridian.test"
