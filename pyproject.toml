[project]
name = "hr-operations-agent"
version = "0.1.0"
description = "Policy-grounded, approval-gated HR operations agent. Kernel is code; every company is a pack."
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9", "pyyaml>=6"]  # stdlib argparse for the CLI: one less thing to install

[project.optional-dependencies]
web = ["fastapi", "uvicorn"]
dev = ["pytest>=8", "httpx"]

[project.scripts]
hrctl = "hr_agent.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:hr_agent.*"]
