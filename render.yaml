# Render blueprint: one service, the whole agent.
#
# The container serves the dashboard and the JSON API from the same origin, so
# there is no API address to bake into the dashboard and no CORS origin to keep
# in step -- the two settings that most often broke the two-service version.
#
# Deploy: Render -> New -> Blueprint -> pick this repo. Nothing to fill in.

services:
  - type: web
    name: hr-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health

    # Render's free plan cannot attach a disk, so on free the database lives in
    # the container and the demo re-seeds whenever the instance restarts (the
    # dashboard banner says so). To keep state across restarts, switch to a
    # paid plan and add:
    #
    #   plan: starter
    #   disk:
    #     name: hr-agent-data
    #     mountPath: /data
    #     sizeGB: 1
    plan: free

    envVars:
      - key: HR_VAR_DIR
        value: /data

      # The role switcher is the demo: you act as an employee, then as the HR
      # partner who approves their request. The server refuses to serve that
      # publicly unless this exact sentence acknowledges what it means -- a
      # truthy value is deliberately not enough.
      #
      # Only set this for the FICTIONAL companies in packs/. For anything with
      # real employees, leave it out and turn on authentication instead
      # (HR_AUTH=on plus HR_AUTH_SECRET).
      - key: HR_PUBLIC_DEMO
        value: anyone-can-act-as-anyone
